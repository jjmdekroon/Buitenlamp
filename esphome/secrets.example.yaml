# Template for the private settings of esphome/buitenlamp.yaml.
# Copy this file to esphome/secrets.yaml and fill it in. Never commit secrets.yaml;
# .gitignore keeps it out of git.

# A 2.4 GHz network; the ESP32-C3 cannot join 5 GHz.
wifi_ssid: "ssid"
wifi_password: "password"

# 32 random bytes in base64 (44 characters).
# It protects both the Home Assistant connection and updates over WiFi, so it is the spec's
# "update password" (FR-030, research R12). Generate it once on the PC with:
#   python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "generate-with-the-command-above"
